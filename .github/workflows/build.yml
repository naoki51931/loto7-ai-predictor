name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle Loto7 history
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/tk030-lotto/lotto-data-hub/main/data/loto7.json \
            -o /tmp/loto7.json
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          with open('/tmp/loto7.json', encoding='utf-8') as f:
              data = json.load(f)
          rows = []
          for d in data:
              nums = d.get('numbers', [])
              if len(nums) != 7 or len(set(nums)) != 7 or not all(1 <= int(n) <= 37 for n in nums):
                  continue
              rows.append([int(d['round']), d['date'], *map(int, nums)])
          rows.sort(key=lambda r: r[0])
          if len(rows) < 600:
              raise SystemExit(f'Incomplete Loto7 history: {len(rows)} rows')
          out = Path('app/src/main/assets/loto7.csv')
          with out.open('w', encoding='utf-8', newline='') as f:
              w = csv.writer(f)
              w.writerow(['round','date','n1','n2','n3','n4','n5','n6','n7'])
              w.writerows(rows)
          print(f'Bundled {len(rows)} Loto7 draws, rounds {rows[0][0]}-{rows[-1][0]}')
          PY

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk loto7-ai-predictor.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loto7-ai-predictor-debug-apk
          path: loto7-ai-predictor.apk
          if-no-files-found: error

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-apk"
          TITLE="Loto7 AI Predictor - Latest APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" loto7-ai-predictor.apk --clobber
          else
            gh release create "$TAG" loto7-ai-predictor.apk \
              --title "$TITLE" \
              --notes "Latest Android debug APK built automatically from the main branch."
          fi
