name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check bundled Loto7 history
        run: test -s app/src/main/assets/loto7_history.csv

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk loto7-ai-predictor.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loto7-ai-predictor-debug-apk
          path: loto7-ai-predictor.apk
          if-no-files-found: error

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-apk"
          TITLE="Loto7 AI Predictor - Latest APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" loto7-ai-predictor.apk --clobber
          else
            gh release create "$TAG" loto7-ai-predictor.apk \
              --title "$TITLE" \
              --notes "Latest Android debug APK built automatically from the main branch."
          fi
