name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle Loto7 history
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/tk030-lotto/lotto-data-hub/main/data/loto7.json \
            -o /tmp/loto7.json
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          with open('/tmp/loto7.json', encoding='utf-8') as f:
              data = json.load(f)
          rows = []
          for d in data:
              nums = d.get('numbers', [])
              if len(nums) != 7 or len(set(nums)) != 7 or not all(1 <= int(n) <= 37 for n in nums):
                  continue
              rows.append([int(d['round']), d['date'], *map(int, nums)])
          rows.sort(key=lambda r: r[0])
          if len(rows) < 600:
              raise SystemExit(f'Incomplete Loto7 history: {len(rows)} rows')
          out = Path('app/src/main/assets/loto7.csv')
          with out.open('w', encoding='utf-8', newline='') as f:
              w = csv.writer(f)
              w.writerow(['round','date','n1','n2','n3','n4','n5','n6','n7'])
              w.writerows(rows)
          print(f'Bundled {len(rows)} Loto7 draws, rounds {rows[0][0]}-{rows[-1][0]}')
          PY

      - name: Enable full-screen vertical scrolling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/naoki51931/loto7aipredictor/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          if 'import androidx.compose.foundation.rememberScrollState' not in s:
              s = s.replace('import androidx.compose.foundation.layout.*\n', 'import androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.verticalScroll\n')
          s = s.replace('Modifier.fillMaxSize().padding(padding).padding(16.dp),', 'Modifier.fillMaxSize().padding(padding).padding(16.dp).verticalScroll(rememberScrollState()),')
          s = s.replace('modifier = Modifier.fillMaxWidth().weight(1f),', 'modifier = Modifier.fillMaxWidth().height(400.dp),')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add AI versus random baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/naoki51931/loto7aipredictor/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          marker = 'private data class Evaluation('
          helper = '''private fun combination(n: Int, k: Int): Double {
              if (k < 0 || k > n) return 0.0
              val kk = minOf(k, n - k)
              var result = 1.0
              for (i in 1..kk) result = result * (n - kk + i) / i
              return result
          }

          private fun randomExactRate(matches: Int): Double =
              combination(7, matches) * combination(30, 7 - matches) / combination(37, 7) * 100.0

          private fun randomAtLeastRate(minMatches: Int): Double =
              (minMatches..7).sumOf { randomExactRate(it) }

          private const val RANDOM_AVERAGE_MATCHES = 49.0 / 37.0

          '''
          if 'private fun randomAtLeastRate' not in s:
              s = s.replace(marker, helper + marker)
          needle = '''                            Text(
                                "期間比較: 過去側 ${"%.2f".format(e.olderAverage)}個 → " +
                                    "最近側 ${"%.2f".format(e.recentAverage)}個 " +
                                    if (e.recentAverage > e.olderAverage) "（最近の方が高い）"
                                    else if (e.recentAverage < e.olderAverage) "（過去の方が高い）"
                                    else "（同じ）"
                            )'''
          replacement = needle + '''
                            HorizontalDivider()
                            Text("AI vs 完全ランダム", style = MaterialTheme.typography.titleMedium)
                            Text("平均一致: AI ${"%.3f".format(e.averageMatches)}個 / ランダム ${"%.3f".format(RANDOM_AVERAGE_MATCHES)}個 / 差 ${"%+.3f".format(e.averageMatches - RANDOM_AVERAGE_MATCHES)}個")
                            Text("1個以上: AI ${"%.1f".format(e.hit1Rate)}% / ランダム ${"%.1f".format(randomAtLeastRate(1))}%")
                            Text("2個以上: AI ${"%.1f".format(e.hit2Rate)}% / ランダム ${"%.1f".format(randomAtLeastRate(2))}%")
                            Text("3個以上: AI ${"%.1f".format(e.hit3Rate)}% / ランダム ${"%.1f".format(randomAtLeastRate(3))}%")
                            Text("4個以上: AI ${"%.2f".format(e.hit4Rate)}% / ランダム ${"%.2f".format(randomAtLeastRate(4))}%")
                            Text(if (e.averageMatches > RANDOM_AVERAGE_MATCHES) "平均一致はランダム基準を上回っています。" else "平均一致はランダム基準以下です。")'''
          if 'AI vs 完全ランダム' not in s:
              if needle not in s:
                  raise SystemExit('Could not find backtest comparison insertion point')
              s = s.replace(needle, replacement)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Expand model search and ensemble prediction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/naoki51931/loto7aipredictor/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'val candidates = listOf(0.02, 0.05, 0.08, 0.12, 0.18, 0.25, 0.35, 0.50)',
              'val candidates = listOf(0.005, 0.01, 0.02, 0.035, 0.05, 0.08, 0.12, 0.18, 0.25, 0.35, 0.50, 0.75)'
          )
          old = '''private fun scoreNumbers(draws: List<Draw>, lambda: Double, recencyBonusWeight: Double): Map<Int, Double> {
              val sorted = draws.sortedBy { it.date }
              val latest = sorted.last().date
              val scores = mutableMapOf<Int, Double>()
              for (n in 1..37) {
                  var score = 0.0
                  var lastSeen: LocalDate? = null
                  for (draw in sorted) {
                      val age = (latest.toEpochDay() - draw.date.toEpochDay()).toDouble()
                      val weight = exp(-lambda * age)
                      if (n in draw.numbers) {
                          score += weight
                          lastSeen = draw.date
                      }
                  }
                  val recencyBonus = lastSeen?.let {
                      exp(-0.12 * (latest.toEpochDay() - it.toEpochDay()).toDouble())
                  } ?: 0.0
                  scores[n] = score + recencyBonus * recencyBonusWeight
              }
              return scores
          }'''
          new = '''private fun scoreNumbers(draws: List<Draw>, lambda: Double, recencyBonusWeight: Double): Map<Int, Double> {
              val sorted = draws.sortedBy { it.date }
              if (sorted.isEmpty()) return emptyMap()
              val latest = sorted.last().date
              val longWindow = sorted.takeLast(52)
              val recentWindow = sorted.takeLast(12)
              val pairCounts = mutableMapOf<Pair<Int, Int>, Int>()
              for (draw in longWindow) {
                  val ns = draw.numbers.sorted()
                  for (i in ns.indices) for (j in i + 1 until ns.size) {
                      val pair = ns[i] to ns[j]
                      pairCounts[pair] = (pairCounts[pair] ?: 0) + 1
                  }
              }
              val recentFreq = (1..37).associateWith { n -> recentWindow.count { n in it.numbers }.toDouble() }
              val longFreq = (1..37).associateWith { n -> longWindow.count { n in it.numbers }.toDouble() }
              val scores = mutableMapOf<Int, Double>()
              for (n in 1..37) {
                  var decayScore = 0.0
                  var lastSeen: LocalDate? = null
                  for (draw in sorted.takeLast(26)) {
                      val age = (latest.toEpochDay() - draw.date.toEpochDay()).toDouble()
                      if (n in draw.numbers) {
                          decayScore += exp(-lambda * age)
                          lastSeen = draw.date
                      }
                  }
                  val recency = lastSeen?.let { exp(-0.10 * (latest.toEpochDay() - it.toEpochDay()).toDouble()) } ?: 0.0
                  val hot = (recentFreq[n] ?: 0.0) / recentWindow.size.coerceAtLeast(1)
                  val baseline = (longFreq[n] ?: 0.0) / longWindow.size.coerceAtLeast(1)
                  val trend = hot - baseline
                  val pairStrength = (1..37).filter { it != n }.sumOf { other ->
                      pairCounts[minOf(n, other) to maxOf(n, other)] ?: 0
                  }.toDouble() / longWindow.size.coerceAtLeast(1)
                  val gapDays = lastSeen?.let { latest.toEpochDay() - it.toEpochDay() } ?: 365L
                  val gapBalance = exp(-kotlin.math.abs(gapDays - 21.0) / 35.0)
                  scores[n] = decayScore + recency * recencyBonusWeight + hot * 1.15 + trend * 1.8 + pairStrength * 0.10 + gapBalance * 0.20
              }
              return scores
          }'''
          if old not in s:
              raise SystemExit('scoreNumbers block not found')
          s = s.replace(old, new)
          s = s.replace(
              'val recent = draws.filter {\n                                    it.date >= target.minusDays(14) && it.date < target\n                                }',
              'val recent = draws.filter { it.date < target }.sortedBy { it.date }.takeLast(52)'
          )
          s = s.replace(
              'message = "モデル「${model.name}」 / 使用データ: ${recent.size}回 / ${target.minusDays(14)}〜${target.minusDays(1)}"',
              'message = "モデル「${model.name}」 / アンサンブル分析: 直近${recent.size}回"'
          )
          s = s.replace(
              'it.date >= target.date.minusDays(14) && it.date < target.date',
              'it.date < target.date && it.date >= target.date.minusDays(370)'
          )
          s = s.replace(
              'Text("直近2週間を使い、保存したモデルを切り替えて予測")',
              'Text("短期・中期・長期の頻度、トレンド、ペア傾向、出現間隔を組み合わせて予測")'
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk loto7-ai-predictor.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loto7-ai-predictor-debug-apk
          path: loto7-ai-predictor.apk
          if-no-files-found: error

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-apk"
          TITLE="Loto7 AI Predictor - Latest APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" loto7-ai-predictor.apk --clobber
          else
            gh release create "$TAG" loto7-ai-predictor.apk \
              --title "$TITLE" \
              --notes "Latest Android debug APK built automatically from the main branch."
          fi
